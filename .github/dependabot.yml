version: 2
updates:
  # Actions are pinned by commit; this is what moves the pins forward.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The shared packages, at most a day after they ship. Dependabot's list stops at pnpm 10, so CI's
  # frozen install is what proves each lockfile it writes.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: "@leemour/*"
    groups:
      shared:
        patterns:
          - "@leemour/*"
    commit-message:
      prefix: "chore(deps)"
