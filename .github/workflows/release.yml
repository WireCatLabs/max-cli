name: Release

# Started by bin/release. npm trusts this file by name (trusted publishing), so there is no npm
# token anywhere in this repository and renaming the file breaks publishing until npm is told.
#
# Full validation builds, checks and packs once; `build` verifies the immutable tarball.
# The job able to publish runs no code from our dependencies; `publish` holds the OIDC permission and only
# runs `npm publish` on that file; `tag` is the only one that may write to the repository.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack, run npm publish --dry-run, do not tag"
        type: boolean
        default: false
      commit:
        description: "The commit the release report was signed for; the run refuses any other"
        type: string
        default: ""

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Every job builds github.sha, the tip of main when the run started — which a merge can move past the commit
  # bin/release checked the report against.
  signed-commit:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          COMMIT: ${{ inputs.commit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          [ "$COMMIT" = "$GITHUB_SHA" ] && exit 0
          [ "$DRY_RUN" = "true" ] && [ -z "$COMMIT" ] && exit 0
          echo "::error::this run is at $GITHUB_SHA, but the report was signed for '${COMMIT}' — nothing is published"
          exit 1

  validation:
    needs: signed-commit
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      pack: true

  checks:
    needs: signed-commit
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@a9aa6915309bd4ef415053df8f1af9b127f084cc # v0.61.0

  build:
    needs: [checks, validation]
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-package
      - name: Verify validated package integrity
        env:
          EXPECTED_SHA256: ${{ needs.validation.outputs.package-sha256 }}
        run: |
          set -- ./*.tgz
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "Expected exactly one package tarball"; exit 1; }
          [ -n "$EXPECTED_SHA256" ] || { echo "Missing validation digest"; exit 1; }
          printf '%s  %s\n' "$EXPECTED_SHA256" "$1" | sha256sum --check -

      - name: version not yet on npm
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.dry_run }}" != "true" ] && npm view "@wirecat/max-cli@$version" version --prefer-online >/dev/null 2>&1; then
            echo "::error::$version is already on npm — raise the version first"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: wirecat-max-cli-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  package-dry-run:
    needs: build
    if: inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      # Permit checking an already published version; this job has no publishing permissions.
      - run: npm publish ./*.tgz --access public --dry-run --force

  publish:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      # npm, not pnpm: npm's trusted publishing is the documented path. A tarball runs no
      # lifecycle scripts, and nothing is installed here.
      - run: npm publish "wirecat-max-cli-$VERSION.tgz" --access public ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: wait for npm to show the version
        if: ${{ !inputs.dry_run }}
        run: |
          # The version's own document, not `npm view`: on 2026-10-01 the document answered while the
          # version list `npm view` reads was still stale for minutes (cli-base 0.13.0 and 0.14.0).
          for _ in $(seq 90); do
            curl -sfo /dev/null "https://registry.npmjs.org/@wirecat%2fmax-cli/$VERSION" && exit 0
            sleep 10
          done
          echo "::error::npm does not show $VERSION after fifteen minutes — not tagging; tag v$VERSION by hand once it does"
          exit 1

  tag:
    needs: [build, publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "$VERSION"
          git push origin "v$VERSION"

      - name: GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## "v" " {on=1; next} /^## / && on {exit} on' CHANGELOG.md |
            gh release create "v$VERSION" --title "$VERSION" --notes-file -

  # ClawHub's own workflow, pinned: it runs the ClawHub CLI from this commit and needs id-token only to read which
  # commit that is. It publishes the skill only when it changed, as the next patch of ClawHub's own version line.
  clawhub-dry-run:
    needs: build
    if: inputs.dry_run
    permissions:
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@52358852d3510f1150756d48e8a72cb8c8e698e0 # main, 2026-10-25
    with:
      skill_path: skills/max-cli
      owner: wirecat
      dry_run: true

  # After the tag, so a ClawHub failure never holds back the npm release.
  clawhub:
    needs: tag
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@52358852d3510f1150756d48e8a72cb8c8e698e0 # main, 2026-10-25
    with:
      skill_path: skills/max-cli
      owner: wirecat
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
