name: Monthly validation

on:
  schedule:
    - cron: "59 2 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@38e3b7b9a2438b8f61dce754fcdc94d04c32728e # v0.75.2
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
