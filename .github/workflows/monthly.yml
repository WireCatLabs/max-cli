name: Monthly validation

on:
  schedule:
    - cron: "59 2 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@edeab5bde523eda2be178bf2817c95746a1f6f13 # v0.110.0
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
