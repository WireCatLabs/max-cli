name: Monthly validation

on:
  schedule:
    - cron: "59 2 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@a5d97bf6380faa959ba84e9083a8c762d3fa3448 # v0.50.2
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
