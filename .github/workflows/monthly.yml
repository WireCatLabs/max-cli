name: Monthly validation

on:
  schedule:
    - cron: "59 2 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@92629972be70b5c66ee20f75fac586dda13c540e # v0.96.0
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
