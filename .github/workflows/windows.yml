name: Windows and macOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows.yml'
      - 'src/commands/setup.ts'
      - 'src/setup.test.ts'
      - 'src/commands/session.ts'
      - 'src/session/**'
      - 'src/commands/context.ts'
      - 'src/deadline*'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Otherwise checkout turns every line ending into CRLF and fixtures stop matching.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # These runners are slower than ubuntu's; five seconds timed out tests that do not hang.
      # Windows named-pipe fixtures use short RPC budgets; audio/SQLite workers compete with them.
      - if: matrix.os == 'windows-latest'
        run: pnpm test --testTimeout=20000 --maxWorkers=1
      - if: matrix.os != 'windows-latest'
        run: pnpm test --testTimeout=20000
      - run: pnpm build
      - run: node dist/bin/max.js --version
      - run: node dist/bin/max.js upgrade --check --json
      - run: node dist/bin/max.js doctor --json
      - run: node dist/bin/max.js mcp config --json
