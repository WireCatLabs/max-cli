# pnpm blocks dependencies' install scripts by default, so esbuild never unpacks its platform
# binary and vitest fails at startup. Since pnpm 11 the key is `allowBuilds` here, with an explicit
# boolean per package.
allowBuilds:
  esbuild: true
  lefthook: true
minimumReleaseAgeExclude:
  - '@leemour/cli-core@0.1.0 || 0.1.1 || 0.2.0 || 0.3.0 || 0.4.0 || 0.5.0 || 0.6.0 || 0.6.1 || 0.7.0 || 0.8.0 || 0.9.0 || 0.10.0 || 0.12.0'
  - '@leemour/cli-messaging@0.1.0 || 0.2.0 || 0.4.0 || 0.5.0 || 0.10.0 || 0.13.0 || 0.26.0 || 0.28.0 || 0.29.0 || 0.45.0 || 0.49.0 || 0.61.0 || 0.62.0 || 0.64.0 || 0.65.0 || 0.66.0 || 0.69.0 || 0.70.0 || 0.71.0 || 0.72.0 || 0.77.0 || 0.79.0 || 0.86.0 || 0.87.0 || 0.90.0 || 0.92.0 || 0.93.0'
# One copy of cli-core in the install: cli-messaging pins an older one, and with two copies the
# annotate() marks vanish from the generated commands page and errors stop matching their classes.
overrides:
  "@leemour/cli-core": 0.12.0
